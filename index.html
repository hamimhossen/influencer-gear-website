<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Influencer Website</title>
        <link rel="stylesheet" href="styles/index.css" />
        <script
            src="https://kit.fontawesome.com/db5ae4a80d.js"
            crossorigin="anonymous"
        ></script>
    </head>
    <body>
        <header>
            <div class="head">
                <div>
                    <h4 class="head-title">Influencer products</h4>
                </div>
                <div>
                    <nav>
                        <ul>
                            <li><a href="">Home</a></li>
                            <li><a href="">Products</a></li>
                            <li><a href="">Sign up</a></li>
                            <li><a href="">Log In</a></li>
                            <li>
                                <a href="">
                                    <i
                                        class="fa-solid fa-magnifying-glass-minus"
                                    ></i
                                ></a>
                            </li>
                            <li>
                                <a href=""
                                    ><i class="fa-solid fa-cart-shopping"></i
                                ></a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>
        <main>
            <section class="visit">
                <div class="visit-container">
                    <div>
                        <h3 class="visit-title">
                            Start your Journey as <br />
                            Influencer
                        </h3>
                        <p class="visit-description">
                            Lorem ipsum dolor sit amet, consectetur adipiscing
                            elit. Sem <br />
                            vestibulum sed scelerisque eros. Lectus faucibus.
                        </p>
                        <button class="visit-btn">
                            Prebook now
                            <i class="fa-solid fa-arrow-right-long"></i>
                        </button>
                    </div>
                    <div class="visit-image">
                        <img
                            class="visit-img"
                            src="images/main-camera.png"
                            alt=""
                        />
                    </div>
                </div>
            </section>
            <section class="icon">
                <div class="icon-container">
                    <img class="icon-image" src="logos/Alibaba.svg" alt="" />
                    <img class="icon-image" src="logos/Amazon.svg" alt="" />
                    <img
                        class="icon-image"
                        src="logos/Daraz.pk Logo.svg"
                        alt=""
                    />
                    <img class="icon-image" src="logos/Ebay.svg" alt="" />
                    <img class="icon-image" src="logos/Rakuten.svg" alt="" />
                    <img class="icon-image" src="logos/Walmart.svg" alt="" />
                    <img class="icon-image" src="logos/Target.svg" alt="" />
                </div>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
